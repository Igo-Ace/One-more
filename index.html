<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 mei 1945</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <head>
  ...
  <style>
    /* Media query untuk layar kecil (handphone) */
    @media (max-width: 780px) {
      body {
        background-size: cover;
        background-position: center;
      }
      #kartu {
        width: 90%;       /* Lebar kartu menyesuaikan layar */
        margin: 1rem;     /* Margin lebih kecil */
        padding: 1rem;    /* Padding lebih ringkas */
      }
      #kartu h1 {
        font-size: 1.5rem; /* Ukuran font lebih kecil */
      }
      #kartu button {
        font-size: 0.9rem; /* Tombol lebih proporsional */
      }
    }
  </style>
</head>

  </head>
  <body
    style="background-image: url('./image/ARCHIVE.png')"
    class="flex justify-center h-screen items-center"
  >
    <div
      class="bg-white bpx-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-500 rounded-xl text-center animate__animated animate__backInDown m-8 w-80"
      id="kartu"
    >
      <h1 class="text-2xl">Happy Birthday 18</h1>
      <h1
        class="text-3xl text-center text-blue-800 font-bold animate__animated animate__heartBeat animate__infinite"
      >
        ADINDA SPK 🥳
      </h1>
      <button
        class="p-2 bg-blue-900 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate__animated animate__delay-2s animate__tada"
        onclick="ubahKartu()"
      >
        KLIK DISINII YAK !
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script>
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById("kartu");
      function ubahKartu() {
        kartu.innerHTML = `    <h1 class="font-bold text-wrap animate__animated animate__zoomIn">
      Happy birthday Dindaa🥳
      Semoga tahun ini setiap langkahmu adalah kebahagiaan,
      jadi kaya raya, dan selalu dikelilingi oleh orang orang baik. Semoga kita terus bisa
      bareng-bareng, seru-seruan, dan tetep unik yaa! 🎉🎂
    </h1>
    <h2 class="mt-3 animate__animated animate__fadeIn">
      -IGO-
    </h2>
    <button
      class="p-2 bg-slate-600 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
      onclick="refresh()"
    >
      Next
    </button>
    `;
      }
      function refresh() {
        location.reload();
      }
    </script>
  </body>
</html>
